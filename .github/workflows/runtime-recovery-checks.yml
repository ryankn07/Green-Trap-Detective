name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install locked dependencies
        run: npm ci

      - name: Check source syntax and required assets
        run: npm run check

      - name: Verify runtime recovery bundle
        run: npm run bundle:check

      - name: Run automated tests
        run: npm test

      - name: Build static frontend
        run: npm run build:web

      - name: Smoke-test the HTTP server
        shell: bash
        run: |
          set -euo pipefail
          PORT=3123 ROOM_STORE_PATH=/tmp/green-trap-ci-rooms.json node server/server.cjs > /tmp/green-trap-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:3123/health > /tmp/green-trap-health.json; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            cat /tmp/green-trap-server.log
            exit 1
          fi
          cat /tmp/green-trap-health.json
          curl --fail --silent http://127.0.0.1:3123/app.js > /dev/null
          curl --fail --silent http://127.0.0.1:3123/cards/PROJ_01.png > /dev/null
