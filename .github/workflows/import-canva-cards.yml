name: Import GREEN IMPACT Canva cards

on:
  push:
    paths:
      - "ui/cards-manifest.json"
      - "scripts/import_canva_cards.py"
      - ".github/workflows/import-canva-cards.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-cards:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image decoder
        run: python -m pip install Pillow
      - name: Download Canva pages and convert into PNG assets
        run: python scripts/import_canva_cards.py
      - name: Commit card images as permanent game assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui/cards
          if ! git diff --cached --quiet; then
            git commit -m "Add 32 original GREEN IMPACT Canva card images"
            git push origin HEAD:main
          fi
