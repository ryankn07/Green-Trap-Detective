name: Assemble README brand banner

on:
  push:
    branches:
      - docs/use-official-brand-assets
    paths:
      - .github/brand-asset-chunks/complete

permissions:
  contents: write

jobs:
  assemble:
    if: ${{ !contains(github.event.head_commit.message, '[asset-assembly]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Reconstruct banner and commit it
        shell: bash
        run: |
          cat .github/brand-asset-chunks/01.txt \
              .github/brand-asset-chunks/02.txt \
              .github/brand-asset-chunks/03.txt \
              .github/brand-asset-chunks/04.txt > /tmp/brand-banner.b64
          base64 --decode /tmp/brand-banner.b64 > docs/assets/brand-banner.webp
          test "$(od -An -tx1 -N4 docs/assets/brand-banner.webp | tr -d ' \n')" = "52494646"
          test "$(od -An -tx1 -j8 -N4 docs/assets/brand-banner.webp | tr -d ' \n')" = "57454250"
          rm -rf .github/brand-asset-chunks
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: add branded README banner [asset-assembly]"
          git push
