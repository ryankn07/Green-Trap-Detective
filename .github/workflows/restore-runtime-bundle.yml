name: Restore bundled runtime files

on:
  push:
    branches:
      - fix/runtime-bundle-and-room-ui
    paths:
      - "scripts/restore_runtime_bundle.py"
      - ".github/workflows/restore-runtime-bundle.yml"

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore original bundled files
        run: python scripts/restore_runtime_bundle.py
      - name: Validate JavaScript syntax
        run: |
          node --check public/app.js
          node --check server/server.cjs
          node --check server/rooms.cjs
      - name: Commit restored source and data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/dist/data/projects.json public/index.html public/app.js public/style.css
          if ! git diff --cached --quiet; then
            git commit -m "Restore original client and project data from runtime bundle"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
