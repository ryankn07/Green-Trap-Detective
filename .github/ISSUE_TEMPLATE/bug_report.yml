name: Bug report
description: Report a reproducible problem
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: "Please remove personal information, room codes, bearer tokens, and private player data before submitting."
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: A concise description of the problem.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: List the smallest set of steps that reproduces the issue.
      placeholder: |
        1. Start a local room
        2. Join with another player
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Node version, browser, operating system, and deployment target if relevant.
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Remove tokens, room codes, personal information, and private state.
