<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="560" viewBox="0 0 1440 560" role="img" aria-labelledby="title desc">
<title id="title">Green Trap Detective system architecture</title>
<desc id="desc">Browser client communicates with an authenticated HTTP and SSE layer, which coordinates room management, the game engine, per-player state projection and file persistence.</desc>
<defs>
 <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7f4e9"/><stop offset="1" stop-color="#e9eedf"/></linearGradient>
 <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6" fill="none" stroke="#52765b" stroke-width="1.5"/></marker>
 <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#163c2a" flood-opacity=".1"/></filter>
</defs>
<rect width="1440" height="560" rx="24" fill="#f5f2e7"/>
<text x="72" y="72" fill="#173c2b" font-family="Georgia,serif" font-size="34" font-weight="700">System architecture</text>
<text x="72" y="105" fill="#61715d" font-family="Arial,sans-serif" font-size="16">A server-authoritative game with viewer-specific state delivery</text>
<g font-family="Arial,sans-serif" filter="url(#shadow)">
 <rect x="70" y="205" width="220" height="150" rx="18" fill="url(#panel)" stroke="#c6d1b9" stroke-width="2"/>
 <rect x="70" y="205" width="220" height="12" rx="6" fill="#71976a"/>
 <text x="180" y="260" text-anchor="middle" fill="#173c2b" font-size="22" font-weight="700">Browser client</text>
 <text x="180" y="292" text-anchor="middle" fill="#64715f" font-size="15">Vanilla JS · HTML · CSS</text>
 <text x="180" y="320" text-anchor="middle" fill="#64715f" font-size="13">Player session + UI</text>
 <rect x="390" y="205" width="250" height="150" rx="18" fill="#e4ead9" stroke="#8fa886" stroke-width="2"/>
 <rect x="390" y="205" width="250" height="12" rx="6" fill="#3d7954"/>
 <text x="515" y="260" text-anchor="middle" fill="#173c2b" font-size="22" font-weight="700">HTTP + SSE</text>
 <text x="515" y="292" text-anchor="middle" fill="#64715f" font-size="15">Bearer auth · validation</text>
 <text x="515" y="320" text-anchor="middle" fill="#64715f" font-size="13">Origin checks · rate limits</text>
 <rect x="740" y="205" width="240" height="150" rx="18" fill="#f3e8c9" stroke="#d5b66d" stroke-width="2"/>
 <rect x="740" y="205" width="240" height="12" rx="6" fill="#bd9144"/>
 <text x="860" y="260" text-anchor="middle" fill="#4a3b21" font-size="22" font-weight="700">Room manager</text>
 <text x="860" y="292" text-anchor="middle" fill="#766344" font-size="15">Sessions · deadlines</text>
 <text x="860" y="320" text-anchor="middle" fill="#766344" font-size="13">Room lifecycle · SSE fanout</text>
 <rect x="1080" y="125" width="285" height="130" rx="18" fill="#e2eadf" stroke="#9cb497" stroke-width="2"/>
 <rect x="1080" y="125" width="285" height="10" rx="5" fill="#477b55"/>
 <text x="1222" y="178" text-anchor="middle" fill="#173c2b" font-size="21" font-weight="700">Game engine</text>
 <text x="1222" y="208" text-anchor="middle" fill="#64715f" font-size="14">Rules · phases · resolution</text>
 <rect x="1080" y="315" width="285" height="130" rx="18" fill="#e8e6f1" stroke="#b0a7c6" stroke-width="2"/>
 <rect x="1080" y="315" width="285" height="10" rx="5" fill="#77708f"/>
 <text x="1222" y="368" text-anchor="middle" fill="#38334c" font-size="21" font-weight="700">Player projection</text>
 <text x="1222" y="398" text-anchor="middle" fill="#6b6680" font-size="14">Private-safe viewer snapshot</text>
 <rect x="740" y="425" width="240" height="90" rx="18" fill="#e8eee7" stroke="#a8bca3" stroke-width="2"/>
 <text x="860" y="463" text-anchor="middle" fill="#173c2b" font-size="20" font-weight="700">File room store</text>
 <text x="860" y="490" text-anchor="middle" fill="#64715f" font-size="13">Atomic snapshot replacement</text>
</g>
<g fill="none" stroke="#52765b" stroke-width="3" marker-end="url(#arrow)">
 <path d="M290 280H385"/>
 <path d="M640 280H735"/>
 <path d="M980 245L1075 200"/>
 <path d="M980 315L1075 370"/>
 <path d="M860 355V420"/>
 <path d="M1080 190H1010V150H640V235"/>
 <path d="M1080 380H1010V390H650V325H640"/>
</g>
<g fill="#52765b" font-family="Arial,sans-serif" font-size="12">
 <text x="325" y="264">JSON / SSE</text><text x="660" y="264">Commands</text><text x="1000" y="185">Rules</text><text x="1000" y="365">Snapshot</text><text x="880" y="405">Persist</text>
</g>
<text x="72" y="535" fill="#78816f" font-family="Arial,sans-serif" font-size="13">Private information is filtered on the server before HTTP or SSE delivery. The browser is not a security boundary.</text>
</svg>